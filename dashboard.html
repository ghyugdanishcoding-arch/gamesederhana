<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEVONAX Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
:root{--bg:#090710;--card:#19191f;--line:#33333d;--text:#f5f3f8;--muted:#a4a1ae;--purple:#9b5de5;--green:#2fd487;--blue:#3185ff;--pink:#ec6f9d;--orange:#f7a928}
*{box-sizing:border-box;margin:0;padding:0}body{background:radial-gradient(circle at top left,#6f35b51a,transparent 32%),radial-gradient(circle at bottom right,#2868bb12,transparent 30%),var(--bg);color:var(--text);font-family:Poppins,sans-serif;padding:20px 16px 105px;min-height:100vh}.app{max-width:760px;margin:auto}.top{height:58px;display:grid;grid-template-columns:52px 1fr 96px;align-items:center;margin-bottom:18px}.icon{width:46px;height:46px;border:0;background:transparent;color:#ddd;border-radius:15px;display:flex;align-items:center;justify-content:center}.icon span{font-size:29px}.title{text-align:center;font-size:28px}.actions{display:flex;justify-content:flex-end;gap:2px}.smallpp{width:35px;height:35px;border-radius:50%;object-fit:cover;background:#24242c}
.card{background:linear-gradient(145deg,#202026,#18181e);border:1px solid var(--line);border-radius:30px;box-shadow:0 12px 35px #0005}.hero{padding:24px 22px 20px;margin-bottom:22px}.row{display:flex;align-items:center;gap:16px}.avatar{width:80px;height:80px;padding:3px;border-radius:50%;background:linear-gradient(145deg,var(--purple),#274795)}.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#24242c}.meta{flex:1;min-width:0}.greet{font-family:Orbitron,sans-serif;color:#b77aff;letter-spacing:4px;font-size:13px;font-weight:700;margin-bottom:6px}.name{font-size:27px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{border:1px solid #ff777755;background:#e8545418;color:#ffaaaa;padding:10px 13px;border-radius:22px;font-weight:700;font-size:13px}.line{height:1px;background:var(--line);margin:18px 0 15px}.chips{display:flex;gap:10px;flex-wrap:wrap}.chip{border:1px solid var(--line);padding:8px 12px;border-radius:20px;font-size:13px;font-weight:600;color:#bbb;display:flex;gap:7px;align-items:center}.orange{color:#ffc160;border-color:#d9983a66;background:#d9983a10}.green{color:#6bd9b5;border-color:#2fd48755;background:#2fd48710}.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange)}
.head{display:flex;justify-content:space-between;align-items:center;margin:0 6px 12px}.head h2{font:700 17px Orbitron,sans-serif;letter-spacing:3px;color:#aaa8b5}.head button{background:none;border:0;color:#b77aff;font-weight:700}.stories{display:flex;gap:16px;overflow-x:auto;padding:4px 6px 17px;scrollbar-width:none}.story{min-width:76px;text-align:center;background:none;border:0;color:inherit}.ring{width:76px;height:76px;border-radius:50%;padding:3px;background:linear-gradient(145deg,var(--purple),var(--green));margin:auto;position:relative}.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#24242c}.add{position:absolute;right:-3px;bottom:-3px;width:29px;height:29px;border-radius:50%;border:2px solid var(--bg);background:var(--purple);color:#fff;font-size:23px}.storyname{font-size:12px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{padding:18px;margin:8px 0 20px;display:flex;align-items:center;gap:14px}.cover{width:80px;height:80px;border-radius:13px;object-fit:cover;background:#252535}.nowinfo{flex:1;min-width:0}.song{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--muted);font-size:14px;margin-top:4px}.play,.queue{border:0;border-radius:50%;color:#35db88;display:flex;align-items:center;justify-content:center}.play{width:60px;height:60px;background:#173d31}.queue{width:48px;height:48px;background:#142d27}.play span{font-size:31px}.global{padding:25px 22px;margin-bottom:28px}.ghead{display:flex;align-items:center;gap:15px}.gicon{width:55px;height:55px;border-radius:17px;border:1px solid #a15ae066;background:#9b5de518;color:#ae73f4;display:flex;align-items:center;justify-content:center}.gicon span{font-size:29px}.gtitle{font-size:24px;font-weight:700}.online{margin-left:auto;width:12px;height:12px;border-radius:50%;background:var(--green)}.preview{border:1px solid var(--line);border-radius:18px;padding:18px;margin:20px 0;color:#c8c6d0;min-height:80px}.open{width:100%;height:72px;border-radius:20px;border:1px solid #a15ae099;background:#9b5de510;color:#eadcff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.quick{min-height:130px;border-radius:24px;padding:18px;border:1px solid var(--line);color:#fff;text-align:left;background:#1b1b22}.quick:hover{transform:translateY(-2px)}.qicon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:11px}.quick b{display:block;font-size:16px}.quick small{color:var(--muted);font-size:11px}.blue{background:#3185ff16;border-color:#5f98ef66}.blue .qicon{background:#3185ff18;color:#83aeff}.pink{background:#ec6f9d13;border-color:#ec6f9d55}.pink .qicon{background:#ec6f9d18;color:#f387b0}.purple{background:#9b5de513;border-color:#9b5de566}.purple .qicon{background:#9b5de51a;color:#be87fa}.greenc{background:#2fd48710;border-color:#2fd48755}.greenc .qicon{background:#2fd48718;color:#56d99d}
.nav{position:fixed;left:0;right:0;bottom:0;height:74px;background:#09070ef2;backdrop-filter:blur(18px);border-top:1px solid #22222b;display:flex;justify-content:center}.navin{width:min(760px,100%);display:flex;justify-content:space-around;align-items:center}.nav button{width:56px;height:56px;border:0;background:none;color:#888794;border-radius:18px}.nav button.active{background:#9b5de522;color:#fff}.nav span{font-size:29px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#25252d;border:1px solid #454553;padding:11px 16px;border-radius:14px;display:none;z-index:99;font-size:13px}.toast.show{display:block}
@media(max-width:390px){body{padding-left:12px;padding-right:12px}.name{font-size:23px}.role{font-size:11px;padding:8px}.avatar{width:70px;height:70px}.now{gap:9px}.cover{width:68px;height:68px}.queue{display:none}.quick{padding:15px;min-height:122px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="icon" id="menu"><span class="material-symbols-outlined">menu</span></button><h1 class="title">Home</h1><div class="actions"><button class="icon" onclick="location.href='profil.html'"><img id="topPP" class="smallpp"></button><button class="icon" onclick="toast('Tidak ada notifikasi baru')"><span class="material-symbols-outlined">notifications</span></button></div></header>
<section class="card hero"><div class="row"><div class="avatar"><img id="pp"></div><div class="meta"><div class="greet">SALAM,</div><div class="name" id="username">Loading...</div></div><div class="role" id="role">MEMBER</div></div><div class="line"></div><div class="chips"><div class="chip orange"><i class="dot"></i><span id="status">AKUN AKTIF</span></div><div class="chip"><span class="material-symbols-outlined">calendar_month</span><span id="expired">-</span></div><div class="chip green"><span class="material-symbols-outlined">account_balance_wallet</span><span id="wallet">Wallet · Rp 0</span></div></div></section>
<section><div class="head"><h2>STATUS</h2><button onclick="location.href='story.html'">Lihat semua</button></div><div class="stories" id="stories"><button class="story" onclick="location.href='story.html'"><div class="ring"><img id="myPP"><span class="add">+</span></div><div class="storyname">Tambah</div></button></div></section>
<section><div class="head"><h2>NOW PLAYING</h2></div><div class="card now"><div class="cover"></div><div class="nowinfo"><div class="song">DEVONAX — Welcome Home</div><div class="sub">Musik Penciptaan</div></div><button class="play" id="play"><span class="material-symbols-outlined">play_arrow</span></button><button class="queue"><span class="material-symbols-outlined">queue_music</span></button></div></section>
<section class="card global"><div class="ghead"><div class="gicon"><span class="material-symbols-outlined">public</span></div><div class="gtitle">Global Chat</div><i class="online"></i></div><div class="preview" id="chat">Belum ada pesan terbaru.</div><button class="open" onclick="location.href='../chat.html'"><span class="material-symbols-outlined">chat_bubble</span>Buka</button></section>
<section><div class="head"><h2>QUICK ACTION</h2></div><div class="grid">
<button class="quick blue" onclick="toast('Daily Login tercatat')"><span class="qicon"><span class="material-symbols-outlined">calendar_month</span></span><b>Daily Login</b><small>Absen & hadiah harian</small></button>
<button class="quick pink" onclick="location.href='wallet.html'"><span class="qicon"><span class="material-symbols-outlined">favorite</span></span><b>Donasi</b><small>Dukung Jester</small></button>
<button class="quick greenc" onclick="location.href='../store.html'"><span class="qicon"><span class="material-symbols-outlined">shopping_bag</span></span><b>Devonax Shop</b><small>Role & fitur premium</small></button>
<button class="quick purple" onclick="location.href='redeem.html'"><span class="qicon"><span class="material-symbols-outlined">redeem</span></span><b>Redeem</b><small>Masukkan kode hadiah</small></button>
<button class="quick purple" onclick="location.href='story.html'"><span class="qicon"><span class="material-symbols-outlined">auto_stories</span></span><b>Story</b><small>Status semua user</small></button>
<button class="quick blue" onclick="location.href='profil.html'"><span class="qicon"><span class="material-symbols-outlined">account_circle</span></span><b>Profil</b><small>Foto & informasi akun</small></button>
<button class="quick greenc" onclick="location.href='wallet.html'"><span class="qicon"><span class="material-symbols-outlined">account_balance_wallet</span></span><b>DEVONAX Wallet</b><small>Saldo & transaksi</small></button>
<button class="quick pink" onclick="location.href='../private-chat.html'"><span class="qicon"><span class="material-symbols-outlined">forum</span></span><b>Private Chat</b><small>Pesan pribadi</small></button>
</div></section>
</main>
<nav class="nav"><div class="navin"><button class="active"><span class="material-symbols-outlined">home</span></button><button onclick="location.href='story.html'"><span class="material-symbols-outlined">auto_stories</span></button><button onclick="location.href='wallet.html'"><span class="material-symbols-outlined">account_balance_wallet</span></button><button onclick="location.href='profil.html'"><span class="material-symbols-outlined">person</span></button></div></nav><div class="toast" id="toast"></div>
<script>
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}
document.getElementById('play').onclick=function(){let s=this.querySelector('span');s.textContent=s.textContent==='pause'?'play_arrow':'pause'}
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {getDatabase,ref,get,onValue,set,onDisconnect,remove} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAV5qFI5J0cZd0eg2Q6mhEZ0KEiR1URv1c",authDomain:"project-coding-gabut.firebaseapp.com",databaseURL:"https://project-coding-gabut-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"project-coding-gabut",storageBucket:"project-coding-gabut.firebasestorage.app",messagingSenderId:"234910334669",appId:"1:234910334669:web:5203c9e9ce22a596f2b384"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),fallback="https://api.dicebear.com/9.x/bottts-neutral/svg?seed=DEVONAX";
const money=n=>"Rp "+Number(n||0).toLocaleString("id-ID");
function avatar(url){url=url||fallback;["pp","topPP","myPP"].forEach(id=>document.getElementById(id).src=url)}
onAuthStateChanged(auth,async user=>{
 if(!user){location.replace("../login.html");return}
 const ur=ref(db,"users/"+user.uid),first=await get(ur);if(!first.exists()){location.replace("../setup.html");return}
 onValue(ur,s=>{const d=s.val()||{},name=d.username||user.email.split("@")[0],role=(d.role||"Member").toUpperCase(),expAt=Number(d.expiredAt||0);username.textContent=name;roleEl.textContent=role;expired.textContent=d.expired||d.expiredDate||"-";wallet.textContent="Wallet · "+money(d.wallet?.balance??d.walletBalance??d.balance??0);status.textContent=expAt&&Date.now()>=expAt?"AKUN EXPIRED":"AKUN AKTIF";avatar(d.photoURL||d.photoUrl||d.avatar||user.photoURL)})
 const online=ref(db,"online/"+user.uid);await set(online,{username:user.email.split("@")[0],time:Date.now()});onDisconnect(online).remove();addEventListener("beforeunload",()=>remove(online))
 onValue(ref(db,"stories"),s=>{document.querySelectorAll(".remote").forEach(e=>e.remove());let a=[];s.forEach(c=>a.push({id:c.key,...c.val()}));a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0)).slice(0,20).forEach(x=>{let b=document.createElement("button");b.className="story remote";let msg=x.text||x.message||x.status||"Story";b.innerHTML='<div class="ring"><img src="'+(x.photoURL||x.photoUrl||x.avatar||fallback)+'"></div><div class="storyname">'+(x.username||"User")+'</div>';b.onclick=()=>toast(msg);stories.appendChild(b)})})
 onValue(ref(db,"globalChat"),s=>{let last=null;s.forEach(c=>last=c.val());if(last){let m=last.text||last.message||last.content;if(m)chat.textContent=m}})
});
const roleEl=document.getElementById("role");
</script>
</body>
</html>
