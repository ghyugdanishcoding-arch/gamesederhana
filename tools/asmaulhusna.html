<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DEVOXTR4SH — Asmaul Husna</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050505;
  --bg2:#090909;
  --card:#101010;
  --card2:#151515;
  --red:#ff1e1e;
  --red2:#ff4545;
  --redDark:#5e0909;
  --text:#fff;
  --muted:#999;
  --border:#252525;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(255,0,0,.13),transparent 35%),
    linear-gradient(180deg,#080808,#030303);
  color:var(--text);
  font-family:Poppins,sans-serif;
}

/* TOP */
.top{
  position:sticky;
  top:0;
  z-index:20;
  height:68px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 18px;
  background:rgba(5,5,5,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.back{
  width:42px;
  height:42px;
  border-radius:13px;
  border:1px solid #292929;
  background:#101010;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.2s;
}

.back:hover{
  color:var(--red);
  border-color:var(--red);
  transform:translateX(-2px);
}

.logo{
  font-family:Orbitron,sans-serif;
  font-size:17px;
  font-weight:800;
  letter-spacing:1px;
}

.logo span{
  color:var(--red);
}

/* MAIN */
.container{
  width:min(100%,1050px);
  margin:auto;
  padding:25px 16px 45px;
}

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid #292929;
  border-radius:22px;
  padding:25px 22px;
  margin-bottom:18px;
  background:
    linear-gradient(135deg,rgba(255,0,0,.12),rgba(255,0,0,.025)),
    #0d0d0d;
}

.hero:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-75px;
  top:-85px;
  border-radius:50%;
  border:25px solid rgba(255,20,20,.06);
}

.heroIcon{
  width:54px;
  height:54px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,20,20,.1);
  border:1px solid rgba(255,30,30,.25);
  color:var(--red);
  margin-bottom:15px;
}

.hero h1{
  font-family:Orbitron,sans-serif;
  font-size:22px;
  letter-spacing:1px;
  margin-bottom:8px;
}

.hero h1 span{
  color:var(--red);
}

.hero p{
  color:#aaa;
  font-size:13px;
  line-height:1.7;
  max-width:700px;
}

.counter{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:15px;
  padding:8px 12px;
  border-radius:10px;
  background:#151515;
  border:1px solid #292929;
  color:#bbb;
  font-size:12px;
}

.counter b{
  color:var(--red);
}

/* SEARCH */
.searchBox{
  position:relative;
  margin-bottom:18px;
}

.searchBox .material-icons-round{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:#777;
}

#search{
  width:100%;
  height:52px;
  border:1px solid #292929;
  border-radius:15px;
  outline:none;
  background:#0d0d0d;
  color:#fff;
  padding:0 45px;
  font-family:Poppins,sans-serif;
  font-size:13px;
  transition:.2s;
}

#search:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(255,20,20,.08);
}

#clearSearch{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:#191919;
  color:#888;
  cursor:pointer;
  display:none;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.card{
  position:relative;
  min-height:190px;
  padding:18px;
  border:1px solid var(--border);
  border-radius:17px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,.008)),
    var(--card);
  transition:.22s ease;
  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:3px;
  height:0;
  background:var(--red);
  transition:.25s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#421616;
  background:var(--card2);
}

.card:hover:before{
  height:100%;
}

.cardTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.number{
  width:34px;
  height:34px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1a0909;
  border:1px solid #401515;
  color:var(--red);
  font-family:Orbitron,sans-serif;
  font-size:11px;
  font-weight:700;
}

.copy{
  width:34px;
  height:34px;
  border:1px solid #292929;
  background:#151515;
  border-radius:10px;
  color:#777;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
}

.copy:hover{
  color:var(--red);
  border-color:#501515;
}

.arabic{
  direction:rtl;
  text-align:right;
  font-family:"Times New Roman",serif;
  font-size:31px;
  line-height:1.5;
  margin-top:14px;
  color:#fff;
}

.latin{
  margin-top:9px;
  font-family:Orbitron,sans-serif;
  font-size:12px;
  color:var(--red2);
  letter-spacing:.3px;
}

.meaning{
  margin-top:7px;
  color:#999;
  font-size:12px;
  line-height:1.5;
}

/* EMPTY */
.empty{
  display:none;
  text-align:center;
  padding:45px 15px;
  border:1px dashed #292929;
  border-radius:18px;
  color:#777;
}

.empty .material-icons-round{
  font-size:40px;
  color:#444;
  margin-bottom:8px;
}

.empty p{
  font-size:13px;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:50;
  display:flex;
  align-items:center;
  gap:8px;
  padding:11px 15px;
  border:1px solid #432020;
  border-radius:12px;
  background:#111;
  color:#ddd;
  font-size:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.toast .material-icons-round{
  color:#27d46b;
  font-size:18px;
}

/* FOOTER */
.footer{
  text-align:center;
  margin-top:28px;
  color:#555;
  font-size:10px;
  letter-spacing:.5px;
}

.footer span{
  color:#8b1717;
}

/* RESPONSIVE */
@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:520px){
  .top{
    height:62px;
    padding:0 13px;
  }

  .logo{
    font-size:14px;
  }

  .container{
    padding:18px 12px 35px;
  }

  .hero{
    border-radius:18px;
    padding:20px 17px;
  }

  .hero h1{
    font-size:18px;
  }

  .grid{
    grid-template-columns:1fr;
    gap:10px;
  }

  .card{
    min-height:175px;
  }

  .arabic{
    font-size:29px;
  }
}
</style>
</head>

<body>

<header class="top">
  <button class="back" onclick="history.back()" aria-label="Kembali">
    <span class="material-icons-round">arrow_back</span>
  </button>

  <div class="logo">
    DEVOX<span>TR4SH</span>
  </div>
</header>

<main class="container">

  <section class="hero">
    <div class="heroIcon">
      <span class="material-icons-round">auto_awesome</span>
    </div>

    <h1>ASMAUL <span>HUSNA</span></h1>

    <p>
      99 nama Allah yang indah. Gunakan pencarian untuk menemukan
      nama berdasarkan nomor, tulisan Arab, latin, atau artinya.
    </p>

    <div class="counter">
      <span class="material-icons-round" style="font-size:16px">menu_book</span>
      <span><b id="shown">99</b> / 99 Nama</span>
    </div>
  </section>

  <div class="searchBox">
    <span class="material-icons-round">search</span>

    <input
      id="search"
      type="search"
      autocomplete="off"
      placeholder="Cari nama, latin, arti, atau nomor..."
    >

    <button id="clearSearch" onclick="clearSearch()">
      <span class="material-icons-round">close</span>
    </button>
  </div>

  <section id="grid" class="grid"></section>

  <div id="empty" class="empty">
    <span class="material-icons-round">search_off</span>
    <p>Nama Asmaul Husna tidak ditemukan.</p>
  </div>

  <div class="footer">
    DEVOX<span>TR4SH</span> • ASMAUL HUSNA
  </div>

</main>

<div id="toast" class="toast">
  <span class="material-icons-round">check_circle</span>
  <span>Berhasil disalin</span>
</div>

<script>
const names = [
  ["الرحمن","Ar-Rahman","Maha Pengasih"],
  ["الرحيم","Ar-Rahim","Maha Penyayang"],
  ["الملك","Al-Malik","Maha Merajai"],
  ["القدوس","Al-Quddus","Maha Suci"],
  ["السلام","As-Salam","Maha Memberi Keselamatan"],
  ["المؤمن","Al-Mu'min","Maha Memberi Keamanan"],
  ["المهيمن","Al-Muhaimin","Maha Mengawasi"],
  ["العزيز","Al-'Aziz","Maha Perkasa"],
  ["الجبار","Al-Jabbar","Maha Memaksa"],
  ["المتكبر","Al-Mutakabbir","Maha Megah"],
  ["الخالق","Al-Khaliq","Maha Pencipta"],
  ["البارئ","Al-Bari'","Maha Mengadakan"],
  ["المصور","Al-Musawwir","Maha Membentuk Rupa"],

  ["العليم","Al-'Alim","Maha Mengetahui"],
  ["القابض","Al-Qabidh","Maha Menyempitkan"],
  ["الباسط","Al-Basit","Maha Melapangkan"],

  ["المذل","Al-Mudzill","Maha Menghinakan"],
  ["السميع","As-Sami'","Maha Mendengar"],
  ["البصير","Al-Basir","Maha Melihat"],
  ["الحكم","Al-Hakam","Maha Menetapkan Hukum"],
  ["العدل","Al-'Adl","Maha Adil"],
  ["اللطيف","Al-Latif","Maha Lembut"],
  ["الخبير","Al-Khabir","Maha Mengetahui"],
  ["الحليم","Al-Halim","Maha Penyantun"],
  ["العظيم","Al-'Azim","Maha Agung"],
  ["الغفور","Al-Ghafur","Maha Pengampun"],
  ["الشكور","Ash-Shakur","Maha Pembalas Budi"],
  ["العلي","Al-'Aliyy","Maha Tinggi"],
  ["الكبير","Al-Kabir","Maha Besar"],
  ["الحفيظ","Al-Hafizh","Maha Memelihara"],
  ["المقيت","Al-Muqit","Maha Pemberi Kecukupan"],
  ["الحسيب","Al-Hasib","Maha Membuat Perhitungan"],
  ["الجليل","Al-Jalil","Maha Luhur"],
  ["الكريم","Al-Karim","Maha Pemurah"],
  ["الرقيب","Ar-Raqib","Maha Mengawasi"],
  ["المجيب","Al-Mujib","Maha Mengabulkan"],
  ["الواسع","Al-Wasi'","Maha Luas"],
  ["الحكيم","Al-Hakim","Maha Bijaksana"],
  ["الودود","Al-Wadud","Maha Mengasihi"],
  ["المجيد","Al-Majid","Maha Mulia"],
  ["الباعث","Al-Ba'its","Maha Membangkitkan"],
  ["الشهيد","Ash-Syahid","Maha Menyaksikan"],
  ["الحق","Al-Haqq","Maha Benar"],
  ["الوكيل","Al-Wakil","Maha Memelihara"],
  ["القوي","Al-Qawiyy","Maha Kuat"],
  ["المتين","Al-Matin","Maha Kokoh"],
  ["الولي","Al-Waliyy","Maha Melindungi"],
  ["الحميد","Al-Hamid","Maha Terpuji"],
  ["المحصي","Al-Muhshi","Maha Menghitung"],
  ["المبدئ","Al-Mubdi'","Maha Memulai"],
  ["المعيد","Al-Mu'id","Maha Mengembalikan"],
  ["المحيي","Al-Muhyi","Maha Menghidupkan"],

  ["الحي","Al-Hayy","Maha Hidup"],
  ["القيوم","Al-Qayyum","Maha Berdiri Sendiri"],
  ["الواجد","Al-Wajid","Maha Menemukan"],
  ["الماجد","Al-Maajid","Maha Mulia"],
  ["الواحد","Al-Wahid","Maha Tunggal"],
  ["الاحد","Al-Ahad","Maha Esa"],
  ["الصمد","As-Samad","Maha Dibutuhkan"],
  ["القادر","Al-Qadir","Maha Kuasa"],
  ["المقتدر","Al-Muqtadir","Maha Berkuasa"],
  ["المقدم","Al-Muqaddim","Maha Mendahulukan"],
  ["المؤخر","Al-Mu'akhkhir","Maha Mengakhirkan"],
  ["الأول","Al-Awwal","Maha Awal"],
  ["الآخر","Al-Akhir","Maha Akhir"],

  ["الباطن","Al-Batin","Maha Ghaib"],
  ["الوالي","Al-Wali","Maha Memerintah"],
  ["المتعالي","Al-Muta'ali","Maha Tinggi"],
  ["البر","Al-Barr","Maha Penderma"],
  ["التواب","At-Tawwab","Maha Penerima Tobat"],
  ["المنتقم","Al-Muntaqim","Maha Pemberi Balasan"],
  ["العفو","Al-'Afuww","Maha Pemaaf"],
  ["الرؤوف","Ar-Ra'uf","Maha Pengasih"],
  ["مالك الملك","Malik-ul-Mulk","Maha Penguasa Kerajaan"],
  ["ذو الجلال والإكرام","Dzul-Jalali wal-Ikram","Maha Pemilik Kebesaran dan Kemuliaan"],
  ["المقسط","Al-Muqsit","Maha Pemberi Keadilan"],
  ["الجامع","Al-Jami'","Maha Mengumpulkan"],
  ["الغني","Al-Ghaniyy","Maha Kaya"],
  ["المغني","Al-Mughni","Maha Pemberi Kekayaan"],
  ["المانع","Al-Mani'","Maha Mencegah"],
  ["الضار","Ad-Dharr","Maha Menimpakan Kemudaratan"],
  ["النافع","An-Nafi'","Maha Memberi Manfaat"],
  ["النور","An-Nur","Maha Bercahaya"],
  ["الهادي","Al-Hadi","Maha Memberi Petunjuk"],
  ["البديع","Al-Badi'","Maha Pencipta Yang Tiada Banding"],
  ["الباقي","Al-Baqi","Maha Kekal"],
  ["الوارث","Al-Warith","Maha Pewaris"],
  ["الرشيد","Ar-Rashid","Maha Pandai"],
  ["الصبور","As-Sabur","Maha Sabar"]
];

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const shown = document.getElementById("shown");
const empty = document.getElementById("empty");
const clearBtn = document.getElementById("clearSearch");

function render(list){

  grid.innerHTML = "";

  list.forEach((item,index)=>{

    const card = document.createElement("article");
    card.className = "card";

    card.innerHTML = `
      <div class="cardTop">
        <div class="number">${index + 1}</div>

        <button class="copy"
          onclick="copyName(${index})"
          aria-label="Salin">
          <span class="material-icons-round">content_copy</span>
        </button>
      </div>

      <div class="arabic">${item[0]}</div>

      <div class="latin">${item[1]}</div>

      <div class="meaning">${item[2]}</div>
    `;

    /*
      Simpan data asli pada card supaya fungsi copy
      tetap mengambil nama yang sedang ditampilkan.
    */
    card.dataset.arabic = item[0];
    card.dataset.latin = item[1];
    card.dataset.meaning = item[2];

    grid.appendChild(card);
  });

  shown.textContent = list.length;

  if(list.length === 0){
    empty.style.display = "block";
  }else{
    empty.style.display = "none";
  }
}

function copyName(index){

  const visibleCards = [...document.querySelectorAll(".card")];
  const card = visibleCards[index];

  if(!card) return;

  const text =
`${card.dataset.arabic}
${card.dataset.latin}
${card.dataset.meaning}`;

  if(navigator.clipboard){

    navigator.clipboard.writeText(text)
      .then(showToast)
      .catch(()=>fallbackCopy(text));

  }else{
    fallbackCopy(text);
  }
}

function fallbackCopy(text){

  const area = document.createElement("textarea");

  area.value = text;
  area.style.position = "fixed";
  area.style.opacity = "0";

  document.body.appendChild(area);
  area.select();

  try{
    document.execCommand("copy");
    showToast();
  }catch(e){}

  document.body.removeChild(area);
}

function showToast(){

  const toast = document.getElementById("toast");

  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
  },1800);
}

function normalize(text){

  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

function doSearch(){

  const query = normalize(search.value.trim());

  clearBtn.style.display = query ? "flex" : "none";

  if(!query){
    render(names);
    return;
  }

  const result = names.filter((item,index)=>{

    const number = String(index + 1);

    return normalize(item[0]).includes(query) ||
           normalize(item[1]).includes(query) ||
           normalize(item[2]).includes(query) ||
           number === query;

  });

  render(result);
}

function clearSearch(){

  search.value = "";
  search.focus();
  doSearch();
}

search.addEventListener("input",doSearch);

render(names);
</script>

</body>
      </html>
