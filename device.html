<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEVICES · DEVONAX</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Orbitron',sans-serif; }
        :root {
            --bg: #070707;
            --card: #121212;
            --red: #ff2020;
            --green: #46ff8d;
            --text: #fff;
            --muted: #999;
            --border: #2a2a2a;
        }
        body {
            background: var(--bg);
            color: var(--text);
            padding: 18px 18px 30px;
            overflow-x: hidden;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top left, #ff000018, transparent 35%), radial-gradient(circle at bottom right, #ff000018, transparent 35%);
            pointer-events: none;
            z-index: 0;
        }
        .grid {
            position: fixed;
            inset: 0;
            opacity: .04;
            background-image: linear-gradient(#ff0000 1px, transparent 1px), linear-gradient(90deg, #ff0000 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-right { display: flex; align-items: center; gap: 10px; }

        .back-btn, .menu-btn, .info-btn {
            width: 48px; height: 48px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 16px; background: #161616; border: 1px solid #333;
            cursor: pointer; transition: .25s;
        }
        .back-btn:hover, .menu-btn:hover, .info-btn:hover {
            border-color: var(--red);
            box-shadow: 0 0 15px rgba(255,0,0,.4);
        }
        .back-btn span, .menu-btn span, .info-btn span { font-size: 26px; }

        .logo {
            font-size: 20px; font-weight: 800; letter-spacing: 4px;
            color: #d8d8d8; text-shadow: 0 0 8px rgba(255,255,255,.25);
        }
        .logo span { color: var(--red); }

        /* CARD */
        .card {
            background: var(--card);
            border: 1px solid #333;
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 18px;
            position: relative;
            z-index: 2;
        }
        .title {
            font-size: 13px; letter-spacing: 3px; color: #ff5555;
            margin-bottom: 15px; text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
        }
        .title .material-symbols-outlined { font-size: 20px; }

        /* INPUT ADD DEVICE */
        .add-device {
            display: flex; gap: 10px; flex-wrap: wrap;
        }
        .add-device input {
            flex: 1; min-width: 150px;
            padding: 14px 16px; border-radius: 14px;
            border: 1px solid #333; background: #0d0d0d;
            color: #fff; font-size: 13px; outline: none;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .add-device input:focus { border-color: var(--red); }
        .add-device input::placeholder { color: #444; letter-spacing: 0; font-size: 11px; }
        .add-device button {
            padding: 14px 24px; border-radius: 14px; border: none;
            background: var(--red); color: #fff;
            font-size: 12px; font-weight: 700; cursor: pointer;
            transition: .25s; font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px; display: flex; align-items: center; gap: 8px;
        }
        .add-device button:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(255,0,0,.3); }
        .add-device button:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

        /* DEVICE LIST */
        .device-item {
            background: #171717;
            border: 1px solid #2d2d2d;
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: .25s;
        }
        .device-item:hover {
            border-color: var(--red);
            transform: translateX(4px);
            box-shadow: 0 0 20px rgba(255,0,0,.08);
        }
        .device-item .icon {
            width: 44px; height: 44px; min-width: 44px;
            border-radius: 14px; background: #1a1a1a;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #333;
        }
        .device-item .icon span { font-size: 26px; color: var(--red); }
        .device-item .info { flex: 1; min-width: 0; }
        .device-item .info h3 {
            font-size: 14px; font-weight: 700; color: #e0e0e0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .device-item .info p {
            font-size: 10px; color: #888; margin-top: 4px;
            font-family: Arial, sans-serif;
        }
        .device-item .info .status {
            display: inline-block; padding: 2px 12px; border-radius: 30px;
            font-size: 8px; font-weight: 700; letter-spacing: 1px;
            margin-top: 4px;
        }
        .device-item .info .status.online {
            background: #1a3a1a; color: var(--green); border: 1px solid var(--green);
        }
        .device-item .info .status.offline {
            background: #3a1a1a; color: #ff5555; border: 1px solid #ff5555;
        }
        .device-item .actions {
            display: flex; gap: 8px;
        }
        .device-item .actions button {
            width: 36px; height: 36px; border-radius: 12px;
            border: 1px solid #333; background: #1a1a1a;
            color: #888; cursor: pointer; transition: .25s;
            display: flex; align-items: center; justify-content: center;
        }
        .device-item .actions button:hover {
            border-color: var(--red); color: var(--red);
        }
        .device-item .actions button.delete:hover {
            border-color: #ff2020; color: #ff2020; background: #2a0000;
        }

        .empty-state {
            text-align: center; padding: 40px 20px; color: #555;
        }
        .empty-state span {
            font-size: 56px; color: #333; display: block; margin-bottom: 12px;
        }
        .empty-state p { font-size: 13px; font-family: Arial, sans-serif; }

        /* TOAST */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #222; border: 1px solid #444; border-radius: 16px;
            padding: 12px 24px; color: #fff; font-size: 12px; z-index: 999;
            display: none; font-family: Arial, sans-serif; backdrop-filter: blur(10px);
        }
        .toast.show { display: block; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateX(-50%) translateY(20px); }
            to { opacity:1; transform:translateX(-50%) translateY(0); }
        }

        /* DRAWER */
        .drawer {
            position: fixed; top: 0; left: -310px; width: 300px; height: 100%;
            background: #111; border-right: 1px solid #333;
            transition: .3s; z-index: 999; overflow: auto;
        }
        .drawer.show { left: 0; }
        .overlay-menu {
            position: fixed; inset: 0; background: rgba(0,0,0,.55);
            display: none; z-index: 998;
        }
        .overlay-menu.show { display: block; }

        .drawer-header {
            padding: 25px; display: flex; align-items: center; gap: 15px;
            border-bottom: 1px solid #222;
        }
        .drawer-avatar {
            width: 60px; height: 60px; min-width: 60px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(180deg,#ff3030,#700); overflow: hidden;
            cursor: pointer;
        }
        .drawer-avatar img { width:100%; height:100%; object-fit:cover; display:none; }
        .drawer-avatar span { font-size: 32px; }
        #drawerName { font-size: 17px; }
        #drawerRole { margin-top:5px; font-size:11px; color:#ff6666; }

        .drawer-menu { padding: 12px; }
        .drawer-item {
            height: 56px; display: flex; align-items: center; gap: 18px;
            padding: 0 18px; border-radius: 16px; margin-bottom: 8px;
            cursor: pointer; font-size: 13px;
        }
        .drawer-item:hover { background: #1b1b1b; }
        .drawer-item span { font-size: 26px; color: #ff3030; }
        .drawer-item.active { background: #1a0a0a; border: 1px solid #600; }
        .drawer-item.logout {
            margin-top: 25px; background: #220000; border: 1px solid #600;
            color: #ff7777;
        }

        .uid-display {
            background: #0d0d0d; border-radius: 14px; padding: 10px 14px;
            border: 1px solid #222; display: flex; align-items: center;
            justify-content: space-between; gap: 10px; margin-top: 6px;
        }
        .uid-display code {
            font-family: monospace; font-size: 11px; color: var(--green);
            word-break: break-all;
        }
        .uid-display .copy-btn {
            background: none; border: none; color: #888; cursor: pointer;
            font-size: 20px; transition: .25s; padding: 4px;
        }
        .uid-display .copy-btn:hover { color: #fff; }

        @media(max-width:430px) {
            body { padding: 12px; }
            .add-device input { min-width: 100%; }
            .add-device button { width: 100%; justify-content: center; }
            .device-item { padding: 12px; }
            .device-item .info h3 { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="grid"></div>

    <!-- HEADER -->
    <header>
        <div class="header-left">
            <div class="menu-btn" id="menuBtn"><span class="material-symbols-outlined">menu</span></div>
            <div class="back-btn" id="backBtn"><span class="material-symbols-outlined">arrow_back</span></div>
            <div class="logo">DEVICE<span>S</span></div>
        </div>
        <div class="header-right">
            <div class="info-btn" id="infoBtn"><span class="material-symbols-outlined">info</span></div>
        </div>
    </header>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- CARD: ADD DEVICE -->
    <div class="card">
        <div class="title"><span class="material-symbols-outlined">add_circle</span> TAMBAH DEVICE</div>
        <div class="add-device">
            <input type="text" id="deviceIdInput" placeholder="Masukkan UID Device target..." maxlength="30">
            <button id="addDeviceBtn"><span class="material-symbols-outlined" style="font-size:18px;">add</span> TAMBAH</button>
        </div>
    </div>

    <!-- CARD: DEVICE LIST -->
    <div class="card">
        <div class="title"><span class="material-symbols-outlined">devices</span> DEVICE TERHUBUNG</div>
        <div id="deviceList">
            <div class="empty-state">
                <span class="material-symbols-outlined">devices_off</span>
                <p>Belum ada device ditambahkan.<br>Masukkan UID di atas.</p>
            </div>
        </div>
    </div>

    <!-- DRAWER -->
    <div id="drawer" class="drawer">
        <div class="drawer-header">
            <div class="drawer-avatar" id="drawerProfileBtn">
                <img id="drawerProfileImage">
                <span id="drawerProfileIcon" class="material-symbols-outlined">person</span>
            </div>
            <div>
                <h2 id="drawerName">Loading...</h2>
                <p id="drawerRole">User</p>
            </div>
        </div>
        <div class="drawer-menu">
            <div class="drawer-item" id="drawerHome">
                <span class="material-symbols-outlined">home</span> Home
            </div>
            <div class="drawer-item active" id="drawerDevices">
                <span class="material-symbols-outlined">devices</span> Devices
            </div>
            <div class="drawer-item" id="drawerControl">
                <span class="material-symbols-outlined">gamepad</span> Control
            </div>
            <div class="drawer-item" id="drawerSettings">
                <span class="material-symbols-outlined">settings</span> Settings
            </div>
            <div class="drawer-item" style="flex-direction:column;align-items:stretch;height:auto;padding:14px 18px;gap:6px;cursor:default;">
                <div style="display:flex;align-items:center;gap:18px;width:100%;">
                    <span class="material-symbols-outlined">info</span>
                    <span style="flex:1;font-size:12px;">UID ANDA</span>
                </div>
                <div class="uid-display">
                    <code id="uidDisplay">Loading...</code>
                    <button class="copy-btn" id="copyUidBtn" title="Copy UID">
                        <span class="material-symbols-outlined">content_copy</span>
                    </button>
                </div>
            </div>
            <div class="drawer-item logout" id="logoutBtn">
                <span class="material-symbols-outlined">logout</span> Logout
            </div>
        </div>
    </div>
    <div id="overlay" class="overlay-menu"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getDatabase, ref, onValue, get, set, onDisconnect } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAV5qFI5J0cZd0eg2Q6mhEZ0KEiR1URv1c",
            authDomain: "project-coding-gabut.firebaseapp.com",
            databaseURL: "https://project-coding-gabut-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "project-coding-gabut",
            storageBucket: "project-coding-gabut.firebasestorage.app",
            messagingSenderId: "234910334669",
            appId: "1:234910334669:web:5203c9e9ce22a596f2b384"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let currentUid = null;
        let followedDevices = [];

        // TOAST
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3000);
        }

        // DRAWER
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');
        document.getElementById('menuBtn').onclick = () => { drawer.classList.add('show'); overlay.classList.add('show'); };
        overlay.onclick = () => { drawer.classList.remove('show'); overlay.classList.remove('show'); };

        // BACK
        document.getElementById('backBtn').onclick = () => {
            if (document.referrer) window.history.back();
            else location.href = 'dashboard.html';
        };

        // INFO
        document.getElementById('infoBtn').onclick = () => {
            drawer.classList.add('show');
            overlay.classList.add('show');
        };

        // COPY UID
        document.getElementById('copyUidBtn').onclick = () => {
            const uid = document.getElementById('uidDisplay').textContent;
            if (uid && uid !== 'Loading...') {
                if (navigator.clipboard) navigator.clipboard.writeText(uid).then(() => showToast('✅ UID copied!'));
                else {
                    const ta = document.createElement('textarea');
                    ta.value = uid;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    showToast('✅ UID copied!');
                }
            }
        };

        // ========== AUTH ==========
        onAuthStateChanged(auth, async user => {
            if (!user) { location.replace('../login.html'); return; }
            currentUser = user;
            const snap = await get(ref(db, 'users/' + user.uid));
            if (!snap.exists()) { location.replace('../setup.html'); return; }
            const d = snap.val();
            if (d.expiredAt && Date.now() >= Number(d.expiredAt)) {
                alert('Akun expired!');
                await signOut(auth);
                location.replace('../login.html');
                return;
            }
            // Set drawer info
            document.getElementById('drawerName').textContent = d.username || user.email.split('@')[0];
            document.getElementById('drawerRole').textContent = d.role || 'User';
            if (d.profileImage || d.photoURL) {
                const img = d.profileImage || d.photoURL;
                document.getElementById('drawerProfileImage').src = img;
                document.getElementById('drawerProfileImage').style.display = 'block';
                document.getElementById('drawerProfileIcon').style.display = 'none';
            }
            // UID sendiri
            currentUid = user.uid + '_device';
            document.getElementById('uidDisplay').textContent = currentUid;

            // Online status
            const onlineRef = ref(db, 'online/' + user.uid);
            await set(onlineRef, { username: d.username || 'User', role: d.role || 'User', time: Date.now() });
            onDisconnect(onlineRef).remove();

            // Load followed devices dari localStorage
            loadFollowedDevices();
        });

        // ========== FOLLOWED DEVICES (localStorage) ==========
        function loadFollowedDevices() {
            const stored = localStorage.getItem('devonaxFollowedDevices');
            if (stored) {
                try {
                    followedDevices = JSON.parse(stored);
                } catch (e) { followedDevices = []; }
            } else {
                followedDevices = [];
            }
            renderDevices();
        }

        function saveFollowedDevices() {
            localStorage.setItem('devonaxFollowedDevices', JSON.stringify(followedDevices));
        }

        function addDevice(uid) {
            uid = uid.trim();
            if (!uid) { showToast('Masukkan UID'); return; }
            if (followedDevices.includes(uid)) { showToast('UID sudah ada'); return; }
            if (uid === currentUid) { showToast('Tidak bisa menambahkan device sendiri'); return; }
            followedDevices.push(uid);
            saveFollowedDevices();
            renderDevices();
            showToast('✅ Device ditambahkan');
        }

        function removeDevice(uid) {
            followedDevices = followedDevices.filter(d => d !== uid);
            saveFollowedDevices();
            renderDevices();
            showToast('🗑️ Device dihapus');
        }

        // ========== RENDER DEVICES ==========
        function renderDevices() {
            const container = document.getElementById('deviceList');
            if (followedDevices.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="material-symbols-outlined">devices_off</span>
                        <p>Belum ada device ditambahkan.<br>Masukkan UID di atas.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            followedDevices.forEach(uid => {
                // Cek status online dari Firebase
                const onlineRef = ref(db, 'online/' + uid);
                get(onlineRef).then(snap => {
                    const isOnline = snap.exists() && (Date.now() - snap.val().time) < 60000;
                    updateDeviceStatus(uid, isOnline, snap.val());
                }).catch(() => updateDeviceStatus(uid, false, null));

                html += `
                    <div class="device-item" data-uid="${uid}">
                        <div class="icon">
                            <span class="material-symbols-outlined">smartphone</span>
                        </div>
                        <div class="info">
                            <h3 id="dname-${uid}">${uid.substring(0, 12)}…</h3>
                            <p id="dinfo-${uid}">Loading...</p>
                            <span class="status" id="dstatus-${uid}">● LOADING</span>
                        </div>
                        <div class="actions">
                            <button class="delete" data-uid="${uid}" title="Hapus device">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // Event listener klik device -> control.html
            container.querySelectorAll('.device-item').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('.delete')) return;
                    const uid = this.dataset.uid;
                    if (uid) location.href = `control.html?device=${uid}`;
                });
            });

            // Event listener delete
            container.querySelectorAll('.delete').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const uid = this.dataset.uid;
                    if (uid && confirm(`Hapus device ${uid}?`)) {
                        removeDevice(uid);
                    }
                });
            });

            // Update status untuk semua device secara periodik
            followedDevices.forEach(uid => {
                const onlineRef = ref(db, 'online/' + uid);
                onValue(onlineRef, snap => {
                    const isOnline = snap.exists() && (Date.now() - snap.val().time) < 60000;
                    updateDeviceStatus(uid, isOnline, snap.val());
                });
            });
        }

        function updateDeviceStatus(uid, isOnline, data) {
            const statusEl = document.getElementById('dstatus-' + uid);
            const infoEl = document.getElementById('dinfo-' + uid);
            const nameEl = document.getElementById('dname-' + uid);
            if (!statusEl) return;

            if (isOnline) {
                statusEl.textContent = '● ONLINE';
                statusEl.className = 'status online';
                const username = data?.username || uid.substring(0, 12);
                nameEl.textContent = username;
                infoEl.textContent = (data?.role || 'User') + ' · ' + new Date(data?.time).toLocaleTimeString();
            } else {
                statusEl.textContent = '● OFFLINE';
                statusEl.className = 'status offline';
                nameEl.textContent = uid.substring(0, 12) + '…';
                infoEl.textContent = 'Tidak terhubung';
            }
        }

        // ========== ADD BUTTON ==========
        document.getElementById('addDeviceBtn').onclick = () => {
            const input = document.getElementById('deviceIdInput');
            const val = input.value.trim();
            if (val) {
                addDevice(val);
                input.value = '';
            } else {
                showToast('Masukkan UID');
            }
        };

        document.getElementById('deviceIdInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('addDeviceBtn').click();
        });

        // ========== DRAWER NAVIGATION ==========
        document.getElementById('drawerHome').onclick = () => { location.href = 'dashboard.html'; };
        document.getElementById('drawerDevices').onclick = () => { location.href = 'devices.html'; };
        document.getElementById('drawerControl').onclick = () => {
            // Jika belum ada device, arahkan ke devices
            if (followedDevices.length === 0) {
                showToast('Tambahkan device dulu');
                return;
            }
            // Bisa ke devices atau pilih device pertama? Lebih baik ke devices
            location.href = 'devices.html';
        };
        document.getElementById('drawerSettings').onclick = () => { location.href = 'settings.html'; };

        // ========== LOGOUT ==========
        document.getElementById('logoutBtn').onclick = async () => {
            if (!confirm('Logout?')) return;
            if (currentUser) {
                await set(ref(db, 'online/' + currentUser.uid), null);
            }
            await signOut(auth);
            location.replace('../login.html');
        };

        console.log('🔥 DEVICES PAGE READY');
    </script>
</body>
      </html>
